<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lectio</title>
<meta name="description" content="Sermons and devotions from Hana Church.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="lectio">
<meta property="og:title" content="lectio">
<meta property="og:description" content="Sermons and devotions from Hana Church.">
<meta property="og:url" content="https://luvnpce83.github.io/lectio/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@500&display=swap">
<style>
:root {
  --paper: #F4F6F4;
  --ink: #1B2430;
  --muted: #5A6572;
  --lamp: #9A5F0E;
  --rule: #D3D9DC;
  --glow: rgba(214, 150, 48, 0.20);
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Literata", "Iowan Old Style", Georgia, serif;
  --ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E151C; --ink: #E2E6E9; --muted: #98A3AD; --lamp: #E2A849;
    --rule: #26323D; --glow: rgba(226, 168, 73, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E151C; --ink: #E2E6E9; --muted: #98A3AD; --lamp: #E2A849;
  --rule: #26323D; --glow: rgba(226, 168, 73, 0.16);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.65;
  padding: 0 20px 72px;
}
.page { max-width: 40rem; margin: 0 auto; }
header { position: relative; padding-block: 76px 28px; border-bottom: 1px solid var(--rule); }
header::before {
  content: "";
  position: absolute;
  inset: 0 -20px auto -20px;
  height: 300px;
  background: radial-gradient(ellipse 55% 75% at 50% 0%, var(--glow), transparent 70%);
  pointer-events: none;
}
header > * { position: relative; }
h1 {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(2.8rem, 10vw, 4.2rem); line-height: 1; letter-spacing: -0.01em;
  margin: 0 0 12px;
}
.tagline { font-style: italic; color: var(--muted); margin: 0; }
ol { list-style: none; margin: 0; padding: 0; }
li { border-bottom: 1px solid var(--rule); }
li a { display: block; padding: 26px 0; color: inherit; text-decoration: none; }
.meta {
  font-family: var(--ui); font-weight: 500; font-size: 0.75rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--lamp);
  margin: 0 0 6px;
}
h2 {
  font-family: var(--display); font-weight: 600; font-size: 1.9rem; line-height: 1.15;
  margin: 0 0 6px; text-wrap: balance;
}
li a:hover h2 { color: var(--lamp); }
li a:focus-visible { outline: 2px solid var(--lamp); outline-offset: 4px; }
.dek { color: var(--muted); margin: 0; text-wrap: pretty; }
.lord { font-variant: small-caps; letter-spacing: 0.02em; }
@media (max-width: 480px) {
  body { font-size: 1rem; padding-inline: 16px; }
  header { padding-block: 52px 22px; }
  header::before { inset: 0 -16px auto -16px; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>lectio</h1>
    <p class="tagline">Sermons and devotions from Hana Church.</p>
  </header>
  <main>
    <ol>
      <li>
        <a href="the-lamp-of-the-lord/">
          <p class="meta">Sermon · September 27, 2026 · Proverbs 20</p>
          <h2>The Lamp of the <span class="lord">Lord</span></h2>
          <p class="dek">On self-branding, integrity, and being known without having to prove yourself: a reading of Proverbs 20.</p>
        </a>
      </li>
    </ol>
  </main>
</div>
</body>
</html>
